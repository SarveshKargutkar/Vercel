<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Glitchword · Phoenix Hub</title>
    <meta
      name="description"
      content="Glitchword — a 10-round, 30-word Wordle variant — five-letter words, turn-efficiency scoring and flagged glitched tiles that invert their feedback."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="theme.js"></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Glitchword — tokens namespaced --gw-* so nothing leaks into Hub styles.css */
      :root {
        --gw-bg: #0d1016;
        --gw-surface: #151a22;
        --gw-surface-2: #1c222c;
        --gw-line: #2a313d;
        --gw-line-2: #3a4250;
        --gw-text: #e6e9ee;
        --gw-muted: #9aa3b2;
        --gw-accent: #22d3ee;
        --gw-accent-2: #ff3d7f;
        --gw-green: #3fb950;
        --gw-yellow: #d4a72c;
        --gw-gray: #3a414c;
        --gw-key: #2a313c;
        --gw-tile-text: #fff;
        --gw-gold: #e3b341;
        --gw-red: #f85149;
        --gw-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        --gw-mono: "JetBrains Mono", ui-monospace, monospace;
        --gw-sans: "Inter", system-ui, sans-serif;
        --gw-tile: 56px;
      }
      [data-theme="parchment"] {
        --gw-bg: #f4ecd8;
        --gw-surface: #fbf6e9;
        --gw-surface-2: #efe4c9;
        --gw-line: #d7c8a4;
        --gw-line-2: #c4b38c;
        --gw-text: #2b2418;
        --gw-muted: #6b5e45;
        --gw-accent: #0e7490;
        --gw-accent-2: #be185d;
        --gw-green: #2f8a3d;
        --gw-yellow: #b7861b;
        --gw-gray: #8a8272;
        --gw-key: #e4d7b8;
        --gw-gold: #9a6b00;
        --gw-red: #b42318;
        --gw-shadow: 0 20px 50px rgba(60, 40, 10, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--gw-bg);
        color: var(--gw-text);
        font: 15px/1.5 var(--gw-sans);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      :focus-visible {
        outline: 2px solid var(--gw-accent);
        outline-offset: 2px;
      }

      /* ---------- header ---------- */
      .gw-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--gw-line);
        background: var(--gw-bg);
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .gw-top .back {
        font: 600 12px var(--gw-mono);
        color: var(--gw-muted);
        text-decoration: none;
        white-space: nowrap;
      }
      .gw-top .back:hover {
        color: var(--gw-accent);
      }
      .logo {
        font: 800 20px var(--gw-mono);
        letter-spacing: 0.02em;
        position: relative;
        margin: 0 6px;
      }
      .logo::before,
      .logo::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.6;
      }
      .logo::before {
        color: var(--gw-accent-2);
        transform: translate(1.5px, 0);
        clip-path: inset(0 0 55% 0);
      }
      .logo::after {
        color: var(--gw-accent);
        transform: translate(-1.5px, 0);
        clip-path: inset(55% 0 0 0);
      }
      .chip {
        font: 600 11px var(--gw-mono);
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--gw-line);
        background: var(--gw-surface);
        color: var(--gw-muted);
        white-space: nowrap;
      }
      .chip b {
        color: var(--gw-text);
      }
      .legend-chip {
        cursor: pointer;
        display: none;
        align-items: center;
        gap: 6px;
      }
      .legend-chip.on {
        display: inline-flex;
      }
      .legend-chip i {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--gw-gray);
        outline: 1.5px dashed var(--gw-accent-2);
        outline-offset: 1px;
        display: inline-block;
      }
      .top-spacer {
        flex: 1;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        border: 1px solid var(--gw-line);
        background: var(--gw-surface);
        cursor: pointer;
        display: grid;
        place-items: center;
        font: 700 15px var(--gw-mono);
        color: var(--gw-muted);
      }
      .icon-btn:hover {
        color: var(--gw-text);
        border-color: var(--gw-line-2);
      }

      /* ---------- layout ---------- */
      .app {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr) 250px;
        gap: 24px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 18px 20px 24px;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--gw-surface);
        border: 1px solid var(--gw-line);
        border-radius: 12px;
        padding: 14px;
      }
      .card h3 {
        margin: 0 0 10px;
        font: 600 11px var(--gw-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gw-muted);
      }
      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
      }

      /* ladder */
      .ladder {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .lcell {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: 12px var(--gw-mono);
        color: var(--gw-muted);
      }
      .lcell .rn {
        font-weight: 700;
      }
      .lcell .dots {
        display: flex;
        gap: 3px;
      }
      .lcell .dots i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--gw-line);
      }
      .lcell .dots i.s {
        background: var(--gw-green);
      }
      .lcell .dots i.f {
        background: var(--gw-red);
      }
      .lcell .dots i.a {
        background: var(--gw-accent);
        animation: gw-pulse 1.4s infinite;
      }
      .lcell .sc {
        font-weight: 700;
        color: var(--gw-text);
        text-align: right;
        min-width: 36px;
      }
      .lcell .sc.up {
        color: var(--gw-green);
      }
      .lcell .sc.dn {
        color: var(--gw-red);
      }
      .lcell.cur {
        border-color: var(--gw-accent);
        background: color-mix(in srgb, var(--gw-accent) 8%, transparent);
        color: var(--gw-text);
      }
      .lcell.lock {
        opacity: 0.5;
      }
      @keyframes gw-pulse {
        50% {
          opacity: 0.35;
        }
      }
      .tier {
        font: 700 15px var(--gw-mono);
      }
      .tier-meta {
        font: 12px var(--gw-mono);
        color: var(--gw-muted);
        margin-top: 4px;
        line-height: 1.7;
      }

      /* score */
      .big {
        font: 800 34px/1 var(--gw-mono);
      }
      .big small {
        font: 600 15px var(--gw-mono);
        color: var(--gw-muted);
      }
      .pace {
        height: 10px;
        border-radius: 99px;
        background: var(--gw-surface-2);
        position: relative;
        margin: 14px 0 22px;
      }
      .pace .fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--gw-accent), var(--gw-green));
        transition: width 0.6s ease;
      }
      .pace .mark {
        position: absolute;
        top: -4px;
        width: 2px;
        height: 18px;
        background: var(--gw-gold);
        transition: left 0.6s ease;
      }
      .pace .mark span {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        font: 600 10px var(--gw-mono);
        color: var(--gw-gold);
        white-space: nowrap;
      }
      .delta {
        font: 600 12px var(--gw-mono);
      }
      .delta.up {
        color: var(--gw-green);
      }
      .delta.dn {
        color: var(--gw-red);
      }
      .preview {
        font: 12px/1.8 var(--gw-mono);
        color: var(--gw-muted);
      }
      .preview b {
        color: var(--gw-accent);
        font-size: 18px;
      }
      .meta-line {
        font: 11px var(--gw-mono);
        color: var(--gw-muted);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 4px;
      }

      /* status strip (mobile) */
      .strip {
        display: none;
      }

      /* ---------- board ---------- */
      .word-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 2px 0 12px;
        font: 600 12px var(--gw-mono);
        color: var(--gw-muted);
      }
      .word-head .role {
        color: var(--gw-text);
      }
      .word-head .gl-tag {
        color: var(--gw-accent-2);
      }
      .board {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }
      .brow {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .brow.shake {
        animation: gw-shake 0.42s;
      }
      .brow.win .tile {
        animation: gw-bounce 0.5s both;
      }
      @keyframes gw-shake {
        20%,
        60% {
          transform: translateX(-7px);
        }
        40%,
        80% {
          transform: translateX(7px);
        }
      }
      @keyframes gw-bounce {
        40% {
          transform: translateY(-10px);
        }
        70% {
          transform: translateY(2px);
        }
      }
      .tile {
        width: var(--gw-tile);
        height: var(--gw-tile);
        display: grid;
        place-items: center;
        font: 800 calc(var(--gw-tile) * 0.46) var(--gw-mono);
        text-transform: uppercase;
        border-radius: 7px;
        border: 2px solid var(--gw-line);
        background: transparent;
        color: var(--gw-text);
        position: relative;
        user-select: none;
      }
      .tile.filled {
        border-color: var(--gw-line-2);
        animation: gw-pop 0.1s;
      }
      @keyframes gw-pop {
        50% {
          transform: scale(1.08);
        }
      }
      .tile .cb {
        position: absolute;
        left: 4px;
        top: 1px;
        font-size: calc(var(--gw-tile) * 0.22);
        display: none;
      }
      body.cbm .tile .cb {
        display: block;
      }
      .tile.G,
      .tile.Y,
      .tile.X {
        border-color: transparent;
        color: var(--gw-tile-text);
      }
      .tile.G {
        background: var(--gw-green);
      }
      .tile.Y {
        background: var(--gw-yellow);
      }
      .tile.X {
        background: var(--gw-gray);
      }
      .tile.flip {
        animation: gw-flip 0.5s ease both;
      }
      @keyframes gw-flip {
        0% {
          transform: rotateX(0);
        }
        50% {
          transform: rotateX(90deg);
        }
        100% {
          transform: rotateX(0);
        }
      }
      /* Glitch flag — 4 cues: dashed RGB-split frame, crack/scanline overlay, ⌁ badge, aria-label */
      .tile.gl {
        outline: 2px dashed var(--gw-accent-2);
        outline-offset: 2px;
        box-shadow:
          -3px 0 0 -1px var(--gw-accent),
          3px 0 0 -1px var(--gw-accent-2);
      }
      .tile.gl::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          linear-gradient(
            115deg,
            transparent 46%,
            rgba(255, 255, 255, 0.5) 47%,
            transparent 49%
          ),
          linear-gradient(
            35deg,
            transparent 60%,
            rgba(255, 255, 255, 0.32) 61%,
            transparent 63%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.14) 0 2px,
            transparent 2px 4px
          );
      }
      .tile.gl::after {
        content: "⌁";
        position: absolute;
        top: -9px;
        right: -9px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--gw-accent-2);
        color: #fff;
        font: 700 12px/18px var(--gw-mono);
        text-align: center;
        z-index: 2;
      }
      .tile.gl.pre {
        opacity: 0.9;
      }
      .tile.gl.pre::before {
        background: repeating-linear-gradient(
          0deg,
          color-mix(in srgb, var(--gw-accent-2) 10%, transparent) 0 2px,
          transparent 2px 4px
        );
      }
      @media (prefers-reduced-motion: no-preference) {
        .tile.gl {
          animation: gw-flick 2.4s infinite steps(1);
        }
        .tile.gl.flip {
          animation: gw-flip 0.5s ease both;
        }
      }
      @keyframes gw-flick {
        0%,
        88% {
          box-shadow:
            -3px 0 0 -1px var(--gw-accent),
            3px 0 0 -1px var(--gw-accent-2);
        }
        90% {
          box-shadow:
            3px 0 0 -1px var(--gw-accent),
            -3px 0 0 -1px var(--gw-accent-2);
        }
        94% {
          box-shadow:
            -5px 1px 0 -1px var(--gw-accent),
            5px -1px 0 -1px var(--gw-accent-2);
        }
      }
      .tile.stab {
        animation: gw-stab 0.45s ease both !important;
      }
      @keyframes gw-stab {
        0% {
          transform: scale(1);
          filter: brightness(1);
        }
        40% {
          transform: scale(1.12);
          filter: brightness(1.6);
        }
        100% {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tile.flip,
        .tile.stab,
        .brow.win .tile,
        .brow.shake,
        .tile.filled {
          animation: none !important;
        }
      }

      /* banner */
      .banner {
        width: 100%;
        max-width: 470px;
        min-height: 0;
        margin: 0 0 12px;
      }
      .banner .inner {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
        flex-wrap: wrap;
        background: var(--gw-surface);
        border: 1px solid var(--gw-line);
        border-radius: 12px;
        padding: 10px 12px;
        animation: gw-rise 0.3s ease both;
      }
      .banner .res {
        font: 600 13px var(--gw-mono);
      }
      .banner .res .pts {
        font: 800 22px var(--gw-mono);
        color: var(--gw-green);
        margin-right: 6px;
      }
      .banner .res .pts.zero {
        color: var(--gw-red);
      }
      .banner .calc {
        font: 11px var(--gw-mono);
        color: var(--gw-muted);
      }
      @keyframes gw-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .submit-bar {
        width: 100%;
        max-width: 500px;
        margin: 0 0 8px;
      }
      .submit-bar .btn {
        width: 100%;
        height: 46px;
        font-size: 14px;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .submit-bar .btn:disabled {
        opacity: 0.4;
        cursor: default;
        filter: none;
      }
      .submit-bar .btn kbd {
        font: 600 11px var(--gw-mono);
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.18);
      }
      .submit-bar.hide {
        display: none;
      }
      .icon-btn[aria-pressed="false"] {
        opacity: 0.55;
      }
      /* keyboard */
      .kb {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        max-width: 500px;
        user-select: none;
      }
      .kr {
        display: flex;
        gap: 5px;
        justify-content: center;
      }
      .key {
        flex: 1 1 0;
        max-width: 44px;
        height: 54px;
        border: 0;
        border-radius: 7px;
        background: var(--gw-key);
        color: var(--gw-text);
        font: 700 15px var(--gw-mono);
        cursor: pointer;
        position: relative;
        display: grid;
        place-items: center;
        touch-action: manipulation;
      }
      .key.wide {
        max-width: 70px;
        flex: 1.5 1 0;
        font-size: 12px;
      }
      .key:active {
        transform: translateY(1px);
      }
      .key.G {
        background: var(--gw-green);
        color: #fff;
      }
      .key.Y {
        background: var(--gw-yellow);
        color: #fff;
      }
      .key.X {
        background: var(--gw-gray);
        color: #fff;
        opacity: 0.55;
      }
      .key.Q {
        background: repeating-linear-gradient(
          135deg,
          var(--gw-key) 0 5px,
          color-mix(in srgb, var(--gw-accent-2) 28%, var(--gw-key)) 5px 10px
        );
      }
      .key.Q::after {
        content: "?";
        position: absolute;
        top: 1px;
        left: 5px;
        font: 700 10px var(--gw-mono);
        color: var(--gw-accent-2);
      }

      /* buttons */
      .btn {
        font: 600 13px var(--gw-mono);
        padding: 10px 16px;
        border-radius: 9px;
        border: 1px solid var(--gw-line);
        background: var(--gw-surface-2);
        color: var(--gw-text);
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--gw-line-2);
      }
      .btn.pri {
        background: var(--gw-accent);
        border-color: var(--gw-accent);
        color: #04161b;
      }
      .btn.pri:hover {
        filter: brightness(1.08);
      }
      .btnrow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* modals */
      .ov {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(5, 8, 12, 0.62);
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      [data-theme="parchment"] .ov {
        background: rgba(60, 45, 20, 0.35);
      }
      .ov.open {
        display: flex;
      }
      .modal {
        width: 100%;
        max-width: 480px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--gw-surface);
        border: 1px solid var(--gw-line);
        border-radius: 16px;
        padding: 22px;
        box-shadow: var(--gw-shadow);
        animation: gw-rise 0.25s ease both;
        position: relative;
      }
      .modal.wide {
        max-width: 640px;
      }
      .modal.glow {
        border-color: var(--gw-accent);
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--gw-accent) 30%, transparent),
          var(--gw-shadow);
      }
      .modal h2 {
        margin: 0 0 4px;
        font: 800 22px var(--gw-mono);
      }
      .modal .kicker {
        font: 700 11px var(--gw-mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gw-accent);
      }
      .modal .kicker.win {
        color: var(--gw-green);
      }
      .modal .kicker.loss {
        color: var(--gw-red);
      }
      .modal p {
        margin: 8px 0;
        color: var(--gw-muted);
      }
      .modal p b {
        color: var(--gw-text);
      }
      .x {
        position: absolute;
        top: 12px;
        right: 12px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        padding: 7px 8px;
        text-align: left;
        border-bottom: 1px solid var(--gw-line);
      }
      th {
        font: 600 11px var(--gw-mono);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--gw-muted);
      }
      td.n,
      th.n {
        text-align: right;
        font-family: var(--gw-mono);
      }
      tr.tot td {
        font-weight: 700;
        border-bottom: 0;
      }
      .tbl {
        border: 1px solid var(--gw-line);
        border-radius: 10px;
        overflow: hidden;
        margin: 12px 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 14px 0;
      }
      .stats div {
        background: var(--gw-surface-2);
        border-radius: 9px;
        padding: 10px 6px;
        text-align: center;
      }
      .stats b {
        display: block;
        font: 800 20px var(--gw-mono);
      }
      .stats small {
        font: 10px var(--gw-mono);
        color: var(--gw-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      pre.share {
        background: var(--gw-bg);
        border: 1px solid var(--gw-line);
        border-radius: 10px;
        padding: 12px;
        font: 12px/1.6 var(--gw-mono);
        white-space: pre-wrap;
        margin: 10px 0;
      }
      .opt {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 8px 0 14px;
      }
      .opt button {
        padding: 10px 6px;
        border-radius: 10px;
        border: 1px solid var(--gw-line);
        background: var(--gw-surface-2);
        cursor: pointer;
        text-align: center;
      }
      .opt button b {
        display: block;
        font: 700 13px var(--gw-mono);
      }
      .opt button small {
        font: 11px var(--gw-mono);
        color: var(--gw-muted);
      }
      .opt button[aria-pressed="true"] {
        border-color: var(--gw-accent);
        background: color-mix(
          in srgb,
          var(--gw-accent) 12%,
          var(--gw-surface-2)
        );
      }
      .opt.two {
        grid-template-columns: repeat(2, 1fr);
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--gw-line);
        font-size: 14px;
      }
      .toggle input {
        width: 40px;
        height: 22px;
        accent-color: var(--gw-accent);
      }
      .help-row {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .help-row .tile {
        --gw-tile: 34px;
      }
      .howto h4 {
        margin: 16px 0 4px;
        font: 700 12px var(--gw-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gw-text);
      }
      .howto ul {
        margin: 6px 0;
        padding-left: 18px;
        color: var(--gw-muted);
      }
      .howto li {
        margin: 3px 0;
      }
      .howto li b {
        color: var(--gw-text);
      }
      .mini-board {
        display: grid;
        gap: 3px;
        margin: 6px 0;
      }
      .mini-board .brow {
        gap: 3px;
        justify-content: flex-start;
      }
      .mini-board .tile {
        --gw-tile: 22px;
        border-radius: 4px;
        border-width: 1px;
      }
      .mini-board .tile.gl {
        outline-width: 1.5px;
        outline-offset: 1px;
      }
      .mini-board .tile.gl::after {
        width: 11px;
        height: 11px;
        font-size: 8px;
        line-height: 11px;
        top: -6px;
        right: -6px;
      }
      .mini-board .review-round {
        margin: 14px 0;
        padding-top: 10px;
        border-top: 1px solid var(--gw-line);
      }
      .review-round h4 {
        margin: 0 0 8px;
        font: 700 12px var(--gw-mono);
        color: var(--gw-muted);
      }
      .review-words {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }
      .review-words .w {
        font: 11px var(--gw-mono);
        color: var(--gw-muted);
      }
      .review-words .w b {
        color: var(--gw-text);
      }

      /* toast */
      .toasts {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
      }
      .toast {
        background: var(--gw-text);
        color: var(--gw-bg);
        font: 600 13px var(--gw-mono);
        padding: 9px 14px;
        border-radius: 9px;
        box-shadow: var(--gw-shadow);
        animation: gw-rise 0.2s ease both;
        max-width: 88vw;
        text-align: center;
      }
      .toast.warn {
        background: var(--gw-accent-2);
        color: #fff;
      }

      /* embed */
      body.embed .gw-top .back {
        display: none;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 10px 12px 16px;
          min-height: 0;
        }
        .rail {
          display: none;
        }
        .strip {
          display: flex;
          flex-direction: column;
          gap: 8px;
          width: 100%;
          max-width: 500px;
          margin-bottom: 8px;
        }
        .strip-top {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font: 600 12px var(--gw-mono);
          gap: 8px;
        }
        .strip-top .sc {
          font: 800 18px var(--gw-mono);
        }
        .strip-top .sc small {
          font: 600 12px var(--gw-mono);
          color: var(--gw-muted);
        }
        .strip-ladder {
          display: grid;
          grid-template-columns: repeat(10, 1fr);
          gap: 3px;
        }
        .strip-ladder i {
          height: 6px;
          border-radius: 2px;
          background: var(--gw-line);
        }
        .strip-ladder i.done {
          background: var(--gw-green);
        }
        .strip-ladder i.behind {
          background: var(--gw-yellow);
        }
        .strip-ladder i.cur {
          background: var(--gw-accent);
        }
        .strip .preview {
          font-size: 11px;
          text-align: center;
        }
        .strip .preview b {
          font-size: 13px;
        }
        .word-head {
          margin-bottom: 8px;
        }
      }
      @media (max-width: 520px) {
        .gw-top {
          padding: 8px 10px;
          gap: 6px;
        }
        .gw-top .back {
          font-size: 0;
        }
        .gw-top .back::before {
          content: "←";
          font-size: 16px;
        }
        .logo {
          font-size: 16px;
        }
        .hide-sm {
          display: none !important;
        }
        .key {
          height: 50px;
          font-size: 13px;
        }
        .kr {
          gap: 4px;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .modal {
          padding: 18px;
        }
      }
      @media (max-height: 720px) and (max-width: 980px) {
        .key {
          height: 44px;
        }
      }
      /* ---- word meanings on the round summary ---- */
      .defrow {
        display: none;
      }
      .defrow.on {
        display: table-row;
      }
      .defrow td {
        padding-top: 0 !important;
        border-top: 0 !important;
      }
      .def {
        display: block;
        font: 400 12.5px/1.45 var(--gw-sans);
        color: var(--gw-muted);
        padding-bottom: 6px;
        max-width: 46ch;
      }
      .def::first-letter {
        text-transform: uppercase;
      }

      /* ---- sticker album ---- */
      .album {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 12px;
        margin: 14px 0 4px;
      }
      .album.compact {
        grid-template-columns: repeat(auto-fit, minmax(96px, 110px));
        justify-content: start;
      }
      .album .slot {
        text-align: center;
        background: var(--gw-surface-2);
        border: 1px solid var(--gw-line);
        border-radius: 12px;
        padding: 10px 6px 9px;
      }
      .album .slot canvas {
        width: 72px;
        height: 72px;
        display: block;
        margin: 0 auto 7px;
      }
      .album .slot b {
        display: block;
        font: 600 11.5px/1.25 var(--gw-sans);
        color: var(--gw-text);
        min-height: 2.5em; /* two-line names must not shift the rarity label */
      }
      .album .slot small {
        display: block;
        margin-top: 3px;
        font: 400 10px/1.35 var(--gw-sans);
        color: var(--gw-muted);
      }
      .album .slot.locked b {
        color: var(--gw-muted);
      }
      .album .slot.have {
        border-color: var(--gw-line-2);
      }
      .album .slot small.r1 {
        color: #7dd3fc;
      }
      .album .slot small.r2 {
        color: #c084fc;
      }
      .album .slot small.r3 {
        color: #fca5f1;
      }
      /* Epic/Foil motion lives in CSS so the canvas stays a single static paint */
      .album .slot.have canvas {
        position: relative;
      }
      @media (prefers-reduced-motion: no-preference) {
        .album .slot.have:hover canvas {
          animation: gw-sheen 1.1s ease;
        }
      }
      @keyframes gw-sheen {
        from {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.28) saturate(1.15);
        }
        to {
          filter: brightness(1);
        }
      }
    </style>
  </head>
  <body>
    <header class="gw-top">
      <a class="back" href="index.html">← Phoenix Hub</a>
      <span class="logo" data-text="GLITCHWORD">GLITCHWORD</span>
      <span class="chip hide-sm" id="hdrRound">R1 · BOOT</span>
      <button
        class="chip legend-chip"
        id="legendChip"
        type="button"
        aria-label="Glitch legend: on a glitched tile green and gray swap, yellow is true. Tap for help."
      >
        <i></i><span>G⇄X · Y true</span>
      </button>
      <span class="top-spacer"></span>
      <button
        class="icon-btn"
        id="btnSound"
        type="button"
        aria-label="Sound effects"
        aria-pressed="true"
        title="Sound on/off"
      >
        🔊
      </button>
      <button
        class="icon-btn"
        id="btnHelp"
        type="button"
        aria-label="How to play"
        title="How to play"
      >
        ?
      </button>
      <button
        class="icon-btn"
        id="btnReview"
        type="button"
        aria-label="Review boards"
        title="Review boards"
      >
        ▦
      </button>
      <button
        class="icon-btn"
        id="btnAlbum"
        type="button"
        aria-label="Sticker collection"
        title="Sticker collection"
      >
        ★
      </button>
      <button
        class="icon-btn"
        id="btnMenu"
        type="button"
        aria-label="New session and settings"
        title="New session &amp; settings"
      >
        ⚙
      </button>
    </header>

    <div class="app">
      <aside class="rail" aria-label="Round progress">
        <div class="card">
          <h3>Rounds</h3>
          <div class="ladder" id="ladder"></div>
        </div>
        <div class="card">
          <h3>Tier</h3>
          <div class="tier" id="tierName"></div>
          <div class="tier-meta" id="tierMeta"></div>
        </div>
      </aside>

      <main class="center">
        <div class="strip" id="strip" aria-hidden="true"></div>
        <div class="word-head" id="wordHead"></div>
        <div class="board" id="board" role="grid" aria-label="Game board"></div>
        <div class="banner" id="banner"></div>
        <div class="submit-bar" id="submitBar">
          <button class="btn pri" id="btnSubmit" type="button" disabled>
            Submit guess <kbd>Enter ↵</kbd>
          </button>
        </div>
        <div class="kb" id="kb" aria-label="Keyboard"></div>
      </main>

      <aside class="rail" aria-label="Score">
        <div class="card">
          <h3>Session score</h3>
          <div class="big" id="scoreBig">0 <small>/ 575</small></div>
          <div class="pace" id="paceBar">
            <div class="fill"></div>
            <div class="mark"><span></span></div>
          </div>
          <div class="delta" id="paceDelta"></div>
          <div class="meta-line">
            <span id="diffLbl"></span><span id="seedLbl"></span>
          </div>
        </div>
        <div class="card">
          <h3>If solved now</h3>
          <div class="preview" id="preview"></div>
        </div>
        <div class="card">
          <h3>Glitch rule</h3>
          <div class="preview">
            On a
            <span style="color: var(--gw-accent-2)">⌁ flagged</span>
            tile:<br />Green ⇒ letter
            <b style="font-size: 12px; color: var(--gw-text)">absent</b
            ><br />Gray ⇒ letter
            <b style="font-size: 12px; color: var(--gw-text)">correct here</b
            ><br />Yellow ⇒
            <b style="font-size: 12px; color: var(--gw-text)">true</b> (never
            lies)
          </div>
        </div>
      </aside>
    </div>

    <div
      class="ov"
      id="ov"
      role="dialog"
      aria-modal="true"
      aria-labelledby="mTitle"
    >
      <div class="modal" id="modal"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="assertive"></div>
    <div class="sr" id="live" aria-live="polite"></div>

          c.textAlign = "center";
          c.fillStyle = "#e6e9ee";
          c.font = "700 34px " + mono;
          c.fillText(Math.round(pct * 100) + "%", cx, cy + 12);

          /* --- middle: round strip --- */
          c.textAlign = "left";
          c.fillStyle = "#9aa3b2";
          c.font = "600 20px " + mono;
          c.fillText("ROUNDS", 80, 392);
          const x0 = 80,
            wTot = 920,
            gap = 10,
            segW = (wTot - gap * (ROUNDS - 1)) / ROUNDS;
          for (let r = 0; r < ROUNDS; r++) {
            const x = x0 + r * (segW + gap);
            c.fillStyle = cardTier(r);
            rrect(c, x, 414, segW, 62, 8);
            c.fill();
            c.fillStyle = "rgba(10,13,20,.85)";
            /* fewer, wider segments can carry the tier name as well */
            c.font = "700 " + (ROUNDS <= 5 ? 24 : 20) + "px " + mono;
            c.textAlign = "center";
            c.fillText(
              ROUNDS <= 5
                ? "R" + (r + 1) + " · " + SCHED[r].tier.toUpperCase()
                : String(r + 1),
              x + segW / 2,
              453,
            );
          }
          c.textAlign = "left";
          c.fillStyle = "#6b7280";
          c.font = "400 17px " + sans;
          c.fillText("green: at or above pace · yellow: close · red: below", 80, 508);

          /* --- stickers --- */
          c.fillStyle = "#9aa3b2";
          c.font = "600 20px " + mono;
          c.fillText(fresh.length ? "UNLOCKED THIS SESSION" : "STICKERS", 80, 574);
          if (fresh.length) {
            const show = fresh.slice(0, 4),
              sz = 150,
              sgap = 42,
              totW = show.length * sz + (show.length - 1) * sgap,
              sx = (CARD - totW) / 2;
            show.forEach((f, i) => {
              const x = sx + i * (sz + sgap);
              c.save();
              c.translate(x, 610);
              drawSticker(c, f.id, sz, f.rarity, false);
              c.restore();
              c.textAlign = "center";
              c.fillStyle = "#e6e9ee";
              c.font = "600 21px " + sans;
              c.fillText(STICKER_BY[f.id].name, x + sz / 2, 796);
              c.fillStyle = RCOL[f.rarity];
              c.font = "600 18px " + mono;
              c.fillText(RARITY[f.rarity].toUpperCase(), x + sz / 2, 822);
            });
            if (fresh.length > show.length) {
              c.textAlign = "left";
              c.fillStyle = "#6b7280";
              c.font = "500 21px " + mono;
              c.fillText("+ " + (fresh.length - show.length) + " more", 80, 862);
            }
          } else {
            c.fillStyle = "#6b7280";
            c.font = "400 26px " + sans;
            c.fillText("No new stickers this session.", 80, 626);
            const al = getAlbum();
            c.fillStyle = "#9aa3b2";
            c.font = "500 24px " + mono;
            c.fillText(
              "Collection: " + Object.keys(al).length + " / " + STICKERS.length,
              80,
              668,
            );
          }

          /* --- footer --- */
          const st2 = sessionStats();
          c.textAlign = "left";
          c.fillStyle = "#9aa3b2";
          c.font = "500 23px " + mono;
          c.fillText(
            st2.solved +
              "/30 solved  ·  avg " +
              st2.avg +
              " guesses  ·  decode " +
              st2.decode +
              "%",
            80,
            922,
          );
          c.strokeStyle = "#1c222c";
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(80, 954);
          c.lineTo(1000, 954);
          c.stroke();
          c.fillStyle = "#22d3ee";
          c.font = "700 24px " + mono;
          c.fillText("GLITCHWORD", 80, 1002);
          c.fillStyle = "#6b7280";
          c.font = "400 21px " + sans;
          c.fillText("Ten rounds. Thirty words. The tiles lie.", 80, 1032);
          c.textAlign = "right";
          c.fillStyle = "#9aa3b2";
          c.font = "500 21px " + mono;
          c.fillText(location.host || "glitchword", 1000, 1020);

          return new Promise((res) => cv.toBlob(res, "image/png"));
        }
        async function shareCard(fresh) {
          let blob = null;
          try {
            blob = await buildCard(fresh);
          } catch (e) {
            blob = null;
          }
          if (!blob) {
            toast("Could not build the image");
            return;
          }
          const file = new File([blob], "glitchword.png", { type: "image/png" });
          if (
            navigator.canShare &&
            navigator.canShare({ files: [file] }) &&
            navigator.share
          ) {
            try {
              await navigator.share({ files: [file], title: "Glitchword" });
              return;
            } catch (e) {
              if (e && e.name === "AbortError") return;
            }
          }
          const url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = "glitchword.png";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          toast("Saved — add it from your camera roll", "", 3200);
        }

        /* ================= events ================= */
        $("kb").addEventListener("click", (e) => {
          const b = e.target.closest(".key");
          if (!b) return;
          type(b.dataset.k);
          b.blur();
        });
        document.addEventListener("keydown", (e) => {
          if ($("ov").classList.contains("open")) {
            if (e.key === "Escape" && modalClosable) closeModal();
            return;
          }
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          if (S.phase === "wordDone" && e.key === "Enter") {
            e.preventDefault();
            advance();
            return;
          }
          if (
            e.target &&
            e.target.closest &&
            e.target.closest("button") &&
            e.key === "Enter"
          )
            e.preventDefault();
          if (e.key === "Enter") type("ENTER");
          else if (e.key === "Backspace") type("BACK");
          else if (/^[a-z]$/i.test(e.key)) type(e.key.toUpperCase());
        });
        $("btnSubmit").onclick = () => {
          SFX.unlock();
          type("ENTER");
        };
        const syncSound = () => {
          const b = $("btnSound");
          b.textContent = PREFS.sound ? "🔊" : "🔇";
          b.setAttribute("aria-pressed", PREFS.sound);
          b.title = PREFS.sound ? "Sound on" : "Sound off";
        };
        $("btnSound").onclick = () => {
          PREFS.sound = !PREFS.sound;
          savePrefs();
          syncSound();
          if (PREFS.sound) SFX.click();
        };
        syncSound();
        $("btnHelp").onclick = showHelp;
        $("legendChip").onclick = showCoach;
        $("btnReview").onclick = () => showReview();
        $("btnAlbum").onclick = () => showAlbum();
        $("btnMenu").onclick = showMenu;
        let rz;
        addEventListener("resize", () => {
          clearTimeout(rz);
          rz = setTimeout(() => {
            if (!busy) renderBoard();
          }, 120);
        });

        /* embed mode */
        const params = new URLSearchParams(location.search);
        if (params.get("embed") === "1") {
          document.body.classList.add("embed");
          if ("ResizeObserver" in window)
            new ResizeObserver(() => {
              try {
                parent.postMessage(
                  {
                    type: "glitchword:height",
                    height: document.documentElement.scrollHeight,
                  },
                  "*",
                );
              } catch (e) {}
            }).observe(document.body);
        }

        /* ================= boot ================= */
        (function boot() {
          const saved = store.get(K_SESSION);
          if (
            saved &&
            saved.v === 1 &&
            Array.isArray(saved.words) &&
            saved.words.length === 30 &&
            TARGET[saved.difficulty]
          ) {
            S = saved;
            ANSWERS = buildAnswers(S.seed);
            if (
              S.mode === "daily" &&
              S.seed !== "daily-" + today() &&
              S.phase !== "done"
            ) {
              newSession(S.difficulty, "daily");
            } else if (S.cur > 0 || S.words[0].rows.length)
              setTimeout(
                () =>
                  toast(
                    `Resumed · Round ${Math.floor(S.cur / 3) + 1} · ${liveTotal()} pts`,
                  ),
                300,
              );
          } else newSession("standard", "daily");
          renderAll();
          if (!PREFS.seenHelp) showHelp();
          else if (S.phase === "play") maybeCoach();
        })();

      })();
    </script>
  </body>
</html>
